    <!-- Immediate Theme & Language Initialization (Zero FOUC) -->
    <script>
      (function() {
        try {
          // 1. Theme state recovery
          var mode = localStorage.getItem('skyer_theme_mode') || 'system';
          var resolved = 'dark';
          if (mode === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            resolved = mode;
          }
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
          var themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute('content', resolved === 'dark' ? '#07090E' : '#FFFFFF');
          }

          // 2. Language state recovery
          var savedLang = localStorage.getItem('skyer_lang_selection') || 'auto';
          var activeLang = 'en';
          if (savedLang === 'vi' || savedLang === 'en') {
            activeLang = savedLang;
          } else {
            var tz = (Intl && Intl.DateTimeFormat) ? Intl.DateTimeFormat().resolvedOptions().timeZone : '';
            var isVN = tz === 'Asia/Ho_Chi_Minh' || tz === 'Asia/Saigon' || (navigator.language && navigator.language.toLowerCase().indexOf('vi') !== -1);
            activeLang = isVN ? 'vi' : 'en';
          }
          root.setAttribute('lang', activeLang);
        } catch (e) {}
      })();
    </script>
