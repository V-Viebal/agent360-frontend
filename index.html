    <!-- Preload Self-Hosted Native Variable WOFF2 Fonts (Zero Network Latency / Zero Layout Shift) -->

    <link rel="preload" href="/fonts/inter-normal-vietnamese.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Immediate Theme & Language Initialization (Zero FOUC & Zero Hydration Flicker) -->
    <style>
      :root {
        --bg-page: #080a0f;
        --text-primary: #eef0f4;
      }
      :root.light, [data-theme="light"] {
        --bg-page: #f8fafc;
        --text-primary: #0f172a;
      }
      html, body {
        background-color: var(--bg-page);
        color: var(--text-primary);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* Disable transitions during initial bootstrap frame so colors never flash */
      html.no-transitions *, html.no-transitions *::before, html.no-transitions *::after {
        transition: none !important;
      }
    </style>
    <script>
      (function() {
        try {
          var root = document.documentElement;
          root.classList.add('no-transitions');

          // 1. Theme state recovery
          var mode = localStorage.getItem('skyer_theme_mode') || 'system';
          var resolved = 'dark';
          if (mode === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            resolved = mode;
          }
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;

          // 2. Language state recovery
          var savedLang = localStorage.getItem('skyer_lang_selection') || 'auto';
          var activeLang = 'en';
          if (savedLang === 'vi' || savedLang === 'en') {
            activeLang = savedLang;
          } else {
            var tz = (Intl && Intl.DateTimeFormat) ? Intl.DateTimeFormat().resolvedOptions().timeZone : '';
            var isVN = tz === 'Asia/Ho_Chi_Minh' || tz === 'Asia/Saigon' || (navigator.language && navigator.language.toLowerCase().indexOf('vi') !== -1);
            activeLang = isVN ? 'vi' : 'en';
          }
          root.setAttribute('lang', activeLang);

          // Re-enable smooth transitions after first paint
          window.requestAnimationFrame(function() {
            window.requestAnimationFrame(function() {
              root.classList.remove('no-transitions');
            });
          });
        } catch (e) {}
      })();
    </script>
