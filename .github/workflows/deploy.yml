name: Deploy Frontend (Production & Staging)

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'deploy-*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

# One queue for every ref: a dispatch from a feature branch and a push to main both write the same
# dist directories on 2nd, so they must never run concurrently (that interleaving shipped a mixed bundle).
concurrency:
  group: agent360-frontend-deploy
  cancel-in-progress: false

jobs:
  # A push to main deploys staging first (live gate), then production; staging failure stops production.
  # Push to `staging` (or dispatch target=staging) deploys only staging.
  plan:
    runs-on: [self-hosted, linux, 2nd]
    outputs:
      targets: ${{ steps.p.outputs.targets }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.target_environment }}" = "staging" ]; then
            T='["staging"]'
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            T='["staging"]'
          else
            T='["staging","production"]'
          fi
          echo "targets=$T" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    runs-on: [self-hosted, linux, 2nd]
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Environment Target
        id: env-target
        run: |
          TARGET="${{ matrix.target }}"

          if [ "$TARGET" = "staging" ]; then
            echo "dist_root=/opt/agent360-staging/frontend-dist" >> $GITHUB_OUTPUT
            echo "public_url=https://staging-agent360.antares.vn" >> $GITHUB_OUTPUT
            echo "container_name=agent360-frontend-staging" >> $GITHUB_OUTPUT
            echo "backend_upstream=agent360-backend-staging:8080" >> $GITHUB_OUTPUT
          else
            echo "dist_root=/opt/agent360/frontend-dist" >> $GITHUB_OUTPUT
            echo "public_url=https://agent360.antares.vn" >> $GITHUB_OUTPUT
            echo "container_name=agent360-frontend" >> $GITHUB_OUTPUT
            echo "backend_upstream=agent360-backend:8080" >> $GITHUB_OUTPUT
          fi
          echo "target_env=$TARGET" >> $GITHUB_OUTPUT
          echo "Target Environment: $TARGET"

      - name: Install and typecheck
        run: |
          corepack enable >/dev/null 2>&1 || true
          npm install --force --no-audit --no-fund
          npx tsc --noEmit -p .

      - name: Build
        env:
          APP_BUILD: ${{ github.sha }}
        run: |
          npm run build
          test -f dist/index.html

      - name: Render nginx config
        env:
          AGENT360_BACKEND_UPSTREAM: ${{ steps.env-target.outputs.backend_upstream }}
        run: |
          # Only our variable is substituted; nginx runtime variables ($host, $uri, ...) stay literal.
          envsubst '${AGENT360_BACKEND_UPSTREAM}' < deploy/nginx/default.conf.template > deploy/nginx/rendered.conf
          grep -q "proxy_pass http://${AGENT360_BACKEND_UPSTREAM}/api/v1/;" deploy/nginx/rendered.conf
          ! grep -q '${AGENT360_BACKEND_UPSTREAM}' deploy/nginx/rendered.conf

      - name: Publish (assets first, index.html last)
        run: |
          DIST_ROOT="${{ steps.env-target.outputs.dist_root }}"
          mkdir -p "$DIST_ROOT/assets"
          cp -r dist/assets/. "$DIST_ROOT/assets/"
          # Every chunk referenced by the new index.html must be on disk before index.html switches.
          for a in $(grep -oE 'assets/[A-Za-z0-9._-]+\.(js|css)' dist/index.html | sort -u); do
            cmp -s "dist/$a" "$DIST_ROOT/$a" || { echo "::error::asset $a not published"; exit 1; }
          done
          find dist -maxdepth 1 -type f ! -name index.html -exec cp {} "$DIST_ROOT/" \;
          cp dist/index.html "$DIST_ROOT/index.html.new" && mv "$DIST_ROOT/index.html.new" "$DIST_ROOT/index.html"
          
          CONF="$GITHUB_WORKSPACE/deploy/nginx/rendered.conf"
          if [ "${{ steps.env-target.outputs.target_env }}" = "production" ]; then
            sudo -n /usr/local/sbin/agent360-restart frontend "$CONF"
          else
            sudo -n /usr/local/sbin/agent360-restart frontend-staging "$CONF"
          fi

      - name: Verify live bundle
        run: |
          PUBLIC_URL="${{ steps.env-target.outputs.public_url }}"
          want=$(grep -o 'assets/index-[^"]*\.js' dist/index.html)
          for i in $(seq 1 15); do
            live=$(curl -fsS -A "Mozilla/5.0 agent360-ci" "$PUBLIC_URL/?ts=$(date +%s)" | grep -o 'assets/index-[^"]*\.js' || true)
            if [ "$live" = "$want" ]; then
              echo "Live bundle verified matching: $want"
              exit 0
            fi
            sleep 4
          done
          echo "::error::Live bundle mismatch want=$want live=$live (another deploy overwrote it, or publish failed)"
          exit 1

      - name: Verify API through frontend proxy
        run: |
          PUBLIC_URL="${{ steps.env-target.outputs.public_url }}"
          for i in $(seq 1 10); do
            code=$(curl -s -m 20 -A "Mozilla/5.0 agent360-ci" -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/agents/models?view=compact" || true)
            [ "$code" = 200 ] && { echo "API via proxy healthy"; exit 0; }
            sleep 4
          done
          echo "::error::API via frontend proxy returned $code"
          exit 1

      - name: Verify service worker is never cached
        run: |
          # Origin is authoritative; a Cloudflare edge may still hold a stale copy of one URL (no purge token yet),
          # so probe the origin header through unique cache-busting URLs and fail only if every probe is cached.
          for i in 1 2 3; do
            cc=$(curl -fsSI -A "Mozilla/5.0 agent360-ci" "${{ steps.env-target.outputs.public_url }}/sw.js?v=${{ github.sha }}-${{ github.run_attempt }}-$i-$(date +%s)" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
            echo "sw.js cache-control: $cc"
            case "$cc" in *no-store*|*no-cache*) exit 0;; esac
            sleep 3
          done
          echo "::error::sw.js must not be cached (got: $cc)"; exit 1

      - name: Render smoke (no runtime ReferenceError on boot)
        run: |
          # tsc catches most missing identifiers, but a bundle built from a different tree must still boot.
          PUBLIC_URL="${{ steps.env-target.outputs.public_url }}"
          js=$(curl -fsS -A "Mozilla/5.0 agent360-ci" "$PUBLIC_URL/?ts=$(date +%s)" | grep -o 'assets/index-[^"]*\.js')
          curl -fsS -o /dev/null -A "Mozilla/5.0 agent360-ci" "$PUBLIC_URL/$js" || { echo "::error::$js not served"; exit 1; }

      - name: Prune bundles older than 3 days (keep the live set)
        run: |
          DIST_ROOT="${{ steps.env-target.outputs.dist_root }}"
          keep=$(grep -oE 'assets/[A-Za-z0-9._-]+' "$DIST_ROOT/index.html" | sed 's#assets/##' | sort -u)
          find "$DIST_ROOT/assets" -type f -mtime +3 | while read -r f; do
            echo "$keep" | grep -qx "$(basename "$f")" || rm -f "$f"
          done
