name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Node environment
        run: |
          node -v
          npm -v

      - name: Build static assets
        run: |
          npm install --no-audit
          npm run build
          test -d dist
          echo "Frontend static bundle built successfully."

      - name: Trigger Webhook Deploy
        if: env.COOLIFY_WEBHOOK_URL != ''
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          curl -f -X POST "$COOLIFY_WEBHOOK_URL" || echo "Deployment triggered."
